# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

accueil:
    path: /
    controller: App\Controller\HomeController::index
    methods: GET

index:
    path: /index
    controller: App\Controller\HomeController::index
    methods: GET

apropos:
    path: /apropos
    controller: App\Controller\HomeController::apropos
    methods: GET

enregistrement:
    path: /enregistrement
    controller: App\Controller\EnregistrementController::index
    methods: GET

users:
    path: /users
    controller: App\Controller\UserController::index
    methods: GET

usersId:
    path: /users/{id}
    controller: App\Controller\UserController::show
    methods: GET

membre:
    path: /membre
    controller: App\Controller\MembreController::index
    methods: GET
    
membreId:
    path: /membre/{id}
    controller: App\Controller\MembreController::afficher
    methods: GET

login:
    path: /login
    controller: App\Controller\SecurityController::login
    methods: GET|POST

logout:
    path: /logout
    controller: App\Controller\SecurityController::logout
    methods: GET




