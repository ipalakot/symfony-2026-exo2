    path: /login
    controller: App\Controller\HomeController::login
    methods: GET

logout:
    path: /logout
    controller: App\Controller\HomeController::logout
    methods: GET

connexion:
    path: /connexion
    controller: App\Controller\HomeController::connexion
    methods: GET

enregistrement:
    path: /enregistrement
    controller: App\Controller\HomeController::enregistrement
    methods: GET

